# 日英ネイティブ要約つきで RSS を収集し、data/articles.json を自動更新する
# Secrets に SUMMARY_API_KEY を設定してから有効になる
name: Ingest AI news (JA+EN)

on:
  schedule:
    # Mac 非依存。*/20 は GitHub 側で間引かれやすいので、明示3本に分ける
    # cron は間引かれやすい。1実行10件×公平枠（理論上最大30件/時、日上限360でブレーキ）
    - cron: '5 * * * *'
    - cron: '25 * * * *'
    - cron: '45 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest-articles
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # 記事間隔＋429待機を見込む（1実行10件想定）
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Run ingest (bilingual native summaries)
        env:
          # Repository secrets のみ参照（Environment は使わない）
          SUMMARY_API_KEY: ${{ secrets.SUMMARY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Variables が未設定のとき空文字になり :- が効かないので、下で明示フォールバック
          SUMMARY_PROVIDER: ${{ vars.SUMMARY_PROVIDER }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
          MAX_ARTICLES_PER_DAY: ${{ vars.MAX_ARTICLES_PER_DAY }}
          MAX_ARTICLES_PER_RUN: ${{ vars.MAX_ARTICLES_PER_RUN }}
          MAX_MONTHLY_COST_JPY: ${{ vars.MAX_MONTHLY_COST_JPY }}
          INGEST_ARTICLE_DELAY_MS: ${{ vars.INGEST_ARTICLE_DELAY_MS }}
        run: |
          set -euo pipefail
          # キー本文は出さない。有無と長さだけ（切り分け用）
          if [ -n "${SUMMARY_API_KEY:-}" ]; then
            echo "Secret SUMMARY_API_KEY: present (len=${#SUMMARY_API_KEY})"
          elif [ -n "${GEMINI_API_KEY:-}" ]; then
            echo "Secret GEMINI_API_KEY: present (len=${#GEMINI_API_KEY}) — SUMMARY_API_KEY にコピーして使います"
            export SUMMARY_API_KEY="$GEMINI_API_KEY"
          elif [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "Secret OPENAI_API_KEY: present (len=${#OPENAI_API_KEY}) — SUMMARY_API_KEY にコピーして使います"
            export SUMMARY_API_KEY="$OPENAI_API_KEY"
          else
            echo "::error::APIキー系 Repository secret が空です。"
            echo "Settings → Secrets and variables → Actions → Repository secrets"
            echo "に SUMMARY_API_KEY（または GEMINI_API_KEY）を追加してください。"
            echo "Environments / Variables タブではありません。キー本文はログに出しません。"
            exit 1
          fi
          # 空の Actions Variable を無視して既定値を使う
          [ -n "${MAX_ARTICLES_PER_DAY:-}" ] || export MAX_ARTICLES_PER_DAY=360
          [ -n "${MAX_ARTICLES_PER_RUN:-}" ] || export MAX_ARTICLES_PER_RUN=10
          [ -n "${MAX_MONTHLY_COST_JPY:-}" ] || export MAX_MONTHLY_COST_JPY=3000
          [ -n "${SUMMARY_MODEL:-}" ] || export SUMMARY_MODEL=gemini-3.1-flash-lite
          [ -n "${SUMMARY_PROVIDER:-}" ] || export SUMMARY_PROVIDER=gemini
          [ -n "${INGEST_ARTICLE_DELAY_MS:-}" ] || export INGEST_ARTICLE_DELAY_MS=4000
          echo "limits: per_run=${MAX_ARTICLES_PER_RUN} per_day=${MAX_ARTICLES_PER_DAY} model=${SUMMARY_MODEL}"
          npm run ingest

      - name: Quality gate (EN density == JA)
        run: npm run quality:check

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json public/articles.json data/feed.json public/feed.json
          if git diff --staged --quiet; then
            echo "記事の更新はありません"
            exit 0
          fi
          git commit -m "chore(feed): ingest bilingual AI news $(date -u +%Y-%m-%dT%H:%MZ)"
          # main への並行 push（手動コミット等）と衝突しても捨てない
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $i); pull --rebase and retry"
            git pull --rebase origin main
          done
          echo "failed to push feed after retries"
          exit 1
