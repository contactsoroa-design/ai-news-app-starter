# 日英ネイティブ要約つきで RSS を収集し、data/articles.json を自動更新する
# Secrets に SUMMARY_API_KEY を設定してから有効になる
name: Ingest AI news (JA+EN)

on:
  schedule:
    # Mac 非依存。*/20 は GitHub 側で間引かれやすいので、明示3本に分ける
    # cron は間引かれやすい。1実行10件×公平枠（理論上最大30件/時、日上限240でブレーキ）
    - cron: '5 * * * *'
    - cron: '25 * * * *'
    - cron: '45 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest-articles
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # 記事間隔＋429待機を見込む（1実行10件想定）
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Run ingest (bilingual native summaries)
        env:
          SUMMARY_API_KEY: ${{ secrets.SUMMARY_API_KEY }}
          # 未設定時は scripts/ingest.ts 側のデフォルト
          SUMMARY_PROVIDER: ${{ vars.SUMMARY_PROVIDER }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
          MAX_ARTICLES_PER_DAY: ${{ vars.MAX_ARTICLES_PER_DAY }}
          MAX_ARTICLES_PER_RUN: ${{ vars.MAX_ARTICLES_PER_RUN }}
          MAX_MONTHLY_COST_JPY: ${{ vars.MAX_MONTHLY_COST_JPY }}
          INGEST_ARTICLE_DELAY_MS: ${{ vars.INGEST_ARTICLE_DELAY_MS }}
        run: |
          if [ -z "$SUMMARY_API_KEY" ]; then
            echo "SUMMARY_API_KEY secret が未設定です。GitHub → Settings → Secrets に追加してください。"
            exit 1
          fi
          # 1実行10件・ソース公平枠。1日上限は Asia/Tokyo
          export MAX_ARTICLES_PER_DAY="${MAX_ARTICLES_PER_DAY:-240}"
          export MAX_ARTICLES_PER_RUN="${MAX_ARTICLES_PER_RUN:-10}"
          export MAX_MONTHLY_COST_JPY="${MAX_MONTHLY_COST_JPY:-3000}"
          export SUMMARY_MODEL="${SUMMARY_MODEL:-gemini-3.1-flash-lite}"
          export SUMMARY_PROVIDER="${SUMMARY_PROVIDER:-gemini}"
          export INGEST_ARTICLE_DELAY_MS="${INGEST_ARTICLE_DELAY_MS:-4000}"
          npm run ingest

      - name: Quality gate (EN density == JA)
        run: npm run quality:check

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json public/articles.json data/feed.json public/feed.json
          if git diff --staged --quiet; then
            echo "記事の更新はありません"
            exit 0
          fi
          git commit -m "chore(feed): ingest bilingual AI news $(date -u +%Y-%m-%dT%H:%MZ)"
          # main への並行 push（手動コミット等）と衝突しても捨てない
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $i); pull --rebase and retry"
            git pull --rebase origin main
          done
          echo "failed to push feed after retries"
          exit 1
