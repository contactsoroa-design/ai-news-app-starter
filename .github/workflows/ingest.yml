# 日英ネイティブ要約つきで RSS を収集し、data/articles.json を自動更新する
# Secrets に SUMMARY_API_KEY を設定してから有効になる
#
# 主起動: Vercel Cron（ops/ingest-wake）→ repository_dispatch
# 保険: 下の schedule（GitHub は間引くことがある。docs/収集-外部cron手順.md）
name: Ingest AI news (JA+EN)

on:
  schedule:
    # 保険枠。混雑しやすい :00/:05/:15/:30/:45 を避け、1時間に6回チャンス
    - cron: '3 * * * *'
    - cron: '13 * * * *'
    - cron: '23 * * * *'
    - cron: '33 * * * *'
    - cron: '43 * * * *'
    - cron: '53 * * * *'
  workflow_dispatch:
  # 主: Vercel Cron（ops/ingest-wake）から
  repository_dispatch:
    types: [ingest]

permissions:
  contents: write

concurrency:
  group: ingest-articles
  # ハングした実行を次の wake（約15分）で自動打ち切り、自己修復する
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    # 平常は1〜7分。LLMハング対策で20分超は打ち切り（soft deadline はスクリプト側12分）
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # repository_dispatch はトリガー時点の SHA を掴むため、
          # キュー待ちのあいだに別 ingest が push すると古い JSON のまま走る。
          # ジョブ開始時に必ず最新 main へ揃える。
          ref: main
          fetch-depth: 0

      - name: Sync to latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Run ingest (bilingual native summaries)
        env:
          # Repository secrets のみ参照（Environment は使わない）
          SUMMARY_API_KEY: ${{ secrets.SUMMARY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Variables が未設定のとき空文字になり :- が効かないので、下で明示フォールバック
          SUMMARY_PROVIDER: ${{ vars.SUMMARY_PROVIDER }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
          MAX_ARTICLES_PER_DAY: ${{ vars.MAX_ARTICLES_PER_DAY }}
          MAX_ARTICLES_PER_RUN: ${{ vars.MAX_ARTICLES_PER_RUN }}
          MAX_ARTICLES_PER_HOUR: ${{ vars.MAX_ARTICLES_PER_HOUR }}
          MAX_ARTICLE_AGE_DAYS: ${{ vars.MAX_ARTICLE_AGE_DAYS }}
          MAX_MONTHLY_COST_JPY: ${{ vars.MAX_MONTHLY_COST_JPY }}
          INGEST_ARTICLE_DELAY_MS: ${{ vars.INGEST_ARTICLE_DELAY_MS }}
          INGEST_QUOTA_TIMEZONE: ${{ vars.INGEST_QUOTA_TIMEZONE }}
          INGEST_RATE_LIMIT_STOP_STREAK: ${{ vars.INGEST_RATE_LIMIT_STOP_STREAK }}
        run: |
          set -euo pipefail
          # キー本文は出さない。有無と長さだけ（切り分け用）
          if [ -n "${SUMMARY_API_KEY:-}" ]; then
            echo "Secret SUMMARY_API_KEY: present (len=${#SUMMARY_API_KEY})"
          elif [ -n "${GEMINI_API_KEY:-}" ]; then
            echo "Secret GEMINI_API_KEY: present (len=${#GEMINI_API_KEY}) — SUMMARY_API_KEY にコピーして使います"
            export SUMMARY_API_KEY="$GEMINI_API_KEY"
          elif [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "Secret OPENAI_API_KEY: present (len=${#OPENAI_API_KEY}) — SUMMARY_API_KEY にコピーして使います"
            export SUMMARY_API_KEY="$OPENAI_API_KEY"
          else
            echo "::error::APIキー系 Repository secret が空です。"
            echo "Settings → Secrets and variables → Actions → Repository secrets"
            echo "に SUMMARY_API_KEY（または GEMINI_API_KEY）を追加してください。"
            echo "Environments / Variables タブではありません。キー本文はログに出しません。"
            exit 1
          fi
          # 空の Actions Variable を無視して既定値を使う（均等配信＋無料RPD余白）
          [ -n "${MAX_ARTICLES_PER_DAY:-}" ] || export MAX_ARTICLES_PER_DAY=400
          [ -n "${MAX_ARTICLES_PER_RUN:-}" ] || export MAX_ARTICLES_PER_RUN=4
          [ -n "${MAX_ARTICLES_PER_HOUR:-}" ] || export MAX_ARTICLES_PER_HOUR=17
          [ -n "${MAX_ARTICLE_AGE_DAYS:-}" ] || export MAX_ARTICLE_AGE_DAYS=7
          [ -n "${MAX_MONTHLY_COST_JPY:-}" ] || export MAX_MONTHLY_COST_JPY=3000
          [ -n "${SUMMARY_MODEL:-}" ] || export SUMMARY_MODEL=gemini-3.1-flash-lite
          [ -n "${SUMMARY_PROVIDER:-}" ] || export SUMMARY_PROVIDER=gemini
          [ -n "${INGEST_ARTICLE_DELAY_MS:-}" ] || export INGEST_ARTICLE_DELAY_MS=4000
          [ -n "${INGEST_QUOTA_TIMEZONE:-}" ] || export INGEST_QUOTA_TIMEZONE=America/Los_Angeles
          [ -n "${INGEST_RATE_LIMIT_STOP_STREAK:-}" ] || export INGEST_RATE_LIMIT_STOP_STREAK=2
          echo "limits: per_run=${MAX_ARTICLES_PER_RUN} per_hour=${MAX_ARTICLES_PER_HOUR} per_day=${MAX_ARTICLES_PER_DAY} tz=${INGEST_QUOTA_TIMEZONE} max_age_days=${MAX_ARTICLE_AGE_DAYS} model=${SUMMARY_MODEL}"
          echo "trigger=${{ github.event_name }}"
          npm run ingest

      - name: Quality gate (EN density == JA)
        run: npm run quality:check

      - name: Commit updated feed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json public/articles.json data/feed.json public/feed.json
          if git diff --staged --quiet; then
            echo "記事の更新はありません"
            exit 0
          fi
          git commit -m "chore(feed): ingest bilingual AI news $(date -u +%Y-%m-%dT%H:%MZ)"
          # 並行 push で articles.json が衝突すると rebase では解けない。
          # ours を退避 → origin/main に載せ替え → URL キーで JSON マージ → 再 commit/push。
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt $i); merge feed JSON onto latest main"
            git rebase --abort 2>/dev/null || true
            mkdir -p /tmp/ingest-feed
            cp data/articles.json /tmp/ingest-feed/ours-articles.json
            git fetch origin main
            git reset --hard origin/main
            npm run feed:merge-push -- /tmp/ingest-feed/ours-articles.json
            git add data/articles.json public/articles.json data/feed.json public/feed.json
            if git diff --staged --quiet; then
              echo "merge produced no net change; done"
              exit 0
            fi
            git commit -m "chore(feed): ingest bilingual AI news $(date -u +%Y-%m-%dT%H:%MZ) (merge retry $i)"
          done
          echo "failed to push feed after retries"
          exit 1
